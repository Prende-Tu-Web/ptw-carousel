<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTW · Carrusel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#ff638f;
  --dark:#111a1b;
  --light:#f1eff4;
  --muted:#6b7077;
  --lav:#e8e6ed;
  --sh:1080px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#c9c7cf;font-family:'Rubik',sans-serif;-webkit-font-smoothing:antialiased;}
body{padding:0 0 80px;}

/* ---------- PAGE CHROME ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 24px;background:rgba(17,26,27,.96);backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.topbar .tb-brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:14px;letter-spacing:.04em;}
.topbar .tb-brand .tb-cat{width:26px;height:26px;color:var(--coral);display:flex;}
.topbar .tb-brand .tb-cat svg{width:100%;height:100%;}
.topbar .tb-brand b{color:var(--coral);}
.tb-actions{display:flex;align-items:center;gap:10px;}
.toggle{
  display:inline-flex;background:rgba(255,255,255,.08);border-radius:999px;padding:4px;gap:2px;
}
.toggle button{
  font-family:inherit;border:0;cursor:pointer;background:transparent;color:rgba(255,255,255,.6);
  font-size:12.5px;font-weight:700;letter-spacing:.04em;padding:7px 16px;border-radius:999px;transition:.18s;
}
.toggle button.on{background:var(--coral);color:#fff;}
.hint{color:rgba(255,255,255,.45);font-size:12px;font-weight:500;}

.deck{display:flex;flex-direction:column;align-items:center;gap:14px;padding:34px 16px 0;}
.unit{display:flex;flex-direction:column;align-items:center;gap:10px;}
.slabel{
  display:flex;align-items:center;gap:10px;color:#3d4145;font-size:11px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;
}
.slabel .n{background:var(--dark);color:#fff;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;}
.frame{
  position:relative;overflow:hidden;border-radius:14px;
  box-shadow:0 22px 60px -20px rgba(17,26,27,.5),0 4px 14px rgba(17,26,27,.16);
}

/* ---------- SLIDE BASE ---------- */
.slide{
  position:absolute;top:0;left:0;width:1080px;height:var(--sh);
  transform-origin:top left;overflow:hidden;
  display:flex;flex-direction:column;
  padding:64px 84px 56px;
}
.slide.dark{background:var(--dark);color:var(--light);}
.slide.light{background:var(--light);color:var(--dark);}
.slide.coral{background:var(--coral);color:#fff;}

/* brand mark top */
.mark{display:flex;flex-direction:column;align-items:center;gap:12px;z-index:6;flex:0 0 auto;}
.mark .ln{width:60px;height:1px;background:var(--coral);}
.mark .tx{font-size:11px;font-weight:700;letter-spacing:.25em;text-transform:uppercase;opacity:.85;}
.slide.coral .mark .ln{background:#fff;}

/* brand bar bottom */
.bar{display:flex;align-items:center;justify-content:space-between;z-index:6;flex:0 0 auto;}
.bar .logo{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:700;letter-spacing:.01em;}
.bar .logo .cat{width:30px;height:30px;color:var(--coral);display:flex;}
.bar .logo .cat svg{width:100%;height:100%;}
.bar .logo b{color:var(--coral);font-weight:700;}
.slide.coral .bar .logo .cat{color:#fff;}
.slide.coral .bar .logo b{color:#fff;}
.bar .url{font-size:12px;font-weight:500;letter-spacing:.04em;opacity:.7;}

/* content region fills middle */
.body{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:5;min-height:0;}

/* shared type */
.tag{font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--coral);display:inline-flex;align-items:center;gap:12px;}
.tag::before{content:"";width:26px;height:2px;background:var(--coral);display:inline-block;}
.h-content{font-size:52px;font-weight:800;letter-spacing:-.035em;line-height:1.08;margin:22px 0 0;}
.p-body{font-size:18px;font-weight:400;line-height:1.65;color:var(--muted);max-width:30ch;margin-top:22px;}
.slide.dark .p-body{color:#9aa0a6;}

/* decorative big number */
.bignum{position:absolute;font-weight:900;line-height:.8;letter-spacing:-.04em;z-index:0;pointer-events:none;}
.slide.light .bignum{color:rgba(17,26,27,.05);}
.slide.dark .bignum{color:rgba(241,239,244,.05);}

/* tip card */
.tip{
  display:flex;align-items:center;gap:18px;background:var(--dark);color:var(--light);
  border-radius:18px;padding:24px 28px;margin-top:30px;max-width:560px;
}
.slide.dark .tip{background:#1b262a;border:1px solid rgba(255,255,255,.07);}
.tip .ico{font-size:30px;line-height:1;flex:0 0 auto;}
.tip .tt{font-size:16px;line-height:1.5;font-weight:500;}
.tip .tt b{color:var(--coral);font-weight:700;}

/* editable affordance */
[contenteditable]{outline:none;border-radius:4px;transition:box-shadow .15s,background .15s;}
[contenteditable]:hover{box-shadow:0 0 0 1.5px rgba(255,99,143,.4);}
[contenteditable]:focus{box-shadow:0 0 0 2px var(--coral);background:rgba(255,99,143,.06);}

/* ============ SLIDE — COVER ============ */
.cover{padding-top:64px;}
.cover .dots{
  position:absolute;inset:0;z-index:0;opacity:.9;
  background-image:radial-gradient(rgba(255,99,143,.22) 2px,transparent 2px);
  background-size:46px 46px;animation:drift 9s linear infinite;
}
.cover .glow{
  position:absolute;left:50%;top:46%;width:760px;height:760px;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,99,143,.42) 0%,rgba(255,99,143,.10) 38%,transparent 64%);
  z-index:1;animation:glow 6s ease-in-out infinite;filter:blur(2px);
}
.cover .body{align-items:flex-start;text-align:left;}
.cover .eyebrow{font-size:13px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--coral);}
.cover h1{
  font-size:72px;font-weight:900;letter-spacing:-.04em;line-height:1.02;margin-top:26px;max-width:14ch;
}
.cover h1 .c{color:var(--coral);}
.cover .sub{font-size:20px;line-height:1.55;color:#9aa0a6;max-width:30ch;margin-top:28px;font-weight:400;}
.particle{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--coral);z-index:2;opacity:0;box-shadow:0 0 14px rgba(255,99,143,.7);}
.p1{left:14%;bottom:24%;animation:rise 7s ease-in 0s infinite;}
.p2{left:30%;bottom:16%;animation:rise 9s ease-in 1.4s infinite;width:6px;height:6px;}
.p3{left:62%;bottom:30%;animation:rise 8s ease-in .7s infinite;}
.p4{left:80%;bottom:20%;animation:rise 10s ease-in 2.2s infinite;width:7px;height:7px;}
.p5{left:46%;bottom:12%;animation:rise 8.5s ease-in 3.1s infinite;width:5px;height:5px;}
.swipe{
  position:absolute;right:84px;bottom:120px;z-index:6;display:flex;align-items:center;gap:10px;
  color:var(--coral);font-size:15px;font-weight:700;letter-spacing:.04em;
}
.swipe .arw{display:inline-block;animation:arrow 1.3s ease-in-out infinite;font-size:18px;}

/* ============ SLIDE — STATS ============ */
.stats-head{margin-bottom:34px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
.stat{
  background:#fff;border-radius:20px;padding:34px 32px;position:relative;overflow:hidden;
  box-shadow:0 10px 30px -16px rgba(17,26,27,.2);
}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--coral);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.7,.3,1);}
.stat:hover::before,.frame.live .stat::before{transform:scaleX(1);}
.stat .num{font-size:64px;font-weight:900;color:var(--coral);letter-spacing:-.04em;line-height:1;}
.stat .lab{font-size:15px;line-height:1.45;color:#3d4145;font-weight:500;margin-top:14px;max-width:22ch;}

/* ============ SLIDE — CTA ============ */
.cta .dots{
  position:absolute;inset:0;z-index:0;
  background-image:radial-gradient(rgba(255,255,255,.26) 2px,transparent 2px);
  background-size:46px 46px;animation:drift 9s linear infinite;
}
.cta .body{align-items:center;text-align:center;z-index:5;}
.cta .eyebrow{font-size:13px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.85);}
.cta h1{font-size:66px;font-weight:900;letter-spacing:-.04em;line-height:1.04;color:#fff;max-width:15ch;margin-top:24px;}
.cta .sub{font-size:19px;line-height:1.55;color:rgba(255,255,255,.9);max-width:32ch;margin-top:24px;font-weight:400;}
.pill{
  display:inline-flex;align-items:center;gap:12px;background:#fff;color:var(--dark);
  font-size:18px;font-weight:700;letter-spacing:.01em;padding:20px 38px;border-radius:999px;margin-top:38px;
  box-shadow:0 18px 40px -14px rgba(17,26,27,.45);
}
.pill .arw{color:var(--coral);font-size:20px;}
.cta .handle{margin-top:26px;font-size:15px;font-weight:700;letter-spacing:.06em;color:#fff;opacity:.95;}

@media (prefers-reduced-motion: reduce){
  .cover .dots,.cta .dots,.cover .glow,.particle,.swipe .arw{animation:none !important;}
  .particle{opacity:.6;}
}
@keyframes drift{from{background-position:0 0;}to{background-position:46px 46px;}}
@keyframes glow{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(1);}50%{opacity:.85;transform:translate(-50%,-50%) scale(1.07);}}
@keyframes rise{0%{transform:translateY(0);opacity:0;}12%{opacity:.8;}88%{opacity:.8;}100%{transform:translateY(-230px);opacity:0;}}
@keyframes arrow{0%,100%{transform:translateX(0);}50%{transform:translateX(9px);}}

/* brand stripes (franjas del logo) */
.mark .franjas{display:flex;align-items:flex-end;gap:7px;height:30px;}
.mark .franjas i{width:7px;border-radius:4px;background:var(--coral);display:block;}
.mark .franjas i:nth-child(1){height:19px;}
.mark .franjas i:nth-child(2){height:30px;}
.mark .franjas i:nth-child(3){height:23px;}
.slide.coral .mark .franjas i{background:#fff;}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-brand"><span class="tb-cat" data-cat></span>Prende Tu <b>Web</b><span style="opacity:.4;font-weight:500;margin-left:4px;">· Carrusel</span></div>
  <div class="tb-actions">
    <span class="hint">Texto editable · clic para editar</span>
    <div class="toggle" id="toggle">
      <button data-r="11" class="on">1:1</button>
      <button data-r="45">4:5</button>
    </div>
  </div>
</div>

<div class="deck" id="deck">
<!--SLIDES-->
</div>

<script>
const CAT_SVG = `<svg viewBox="0 0 1599 1410.88" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><path d="m896.91,860.07h-194.81c-18.4,0-27.62,22.25-14.61,35.26l112.01,112.01,112.01-112.01c13.01-13.01,3.8-35.26-14.61-35.26Z"></path><path d="m1537.04,860.07h-66.23v-269.76l72.57-326.43,28.02-126.27,7.3-32.77c7.09-31.95-4.2-64.58-29.54-85.31-25.27-20.66-59.56-25.34-89.44-12.05l-475.28,211.24c-6.61,2.96-13.7,4.48-20.93,4.48h-328.01c-7.23,0-14.32-1.51-20.93-4.48L139.28,7.47C109.4-5.75,75.11-1.13,49.84,19.52c-25.34,20.72-36.63,53.36-29.54,85.31l7.3,32.77,28.02,126.27,72.57,326.43v269.76H61.96c-34.22,0-61.96,27.74-61.96,61.96h0c0,3.81,3.08,6.89,6.89,6.89h122.05c3.45,35.63,18.99,68.67,44.63,94.26l2.32,2.32-64.53,10.75c-33.75,5.63-56.56,37.55-50.93,71.3h0c.62,3.76,4.17,6.29,7.92,5.66l167.36-27.89,125.27,125.27c28.64,28.71,66.65,44.67,107.16,45.26l109.66,109.66c29.26,29.26,68.16,45.37,109.54,45.37h193.34c41.38,0,80.28-16.11,109.54-45.37l109.54-109.54h28.78c41.38,0,80.28-16.11,109.54-45.37l125.22-125.26,167.34,27.89c3.75.62,7.3-1.91,7.92-5.66,5.63-33.76-17.18-65.68-50.93-71.31l-64.52-10.75,2.32-2.32c25.65-25.58,41.18-58.63,44.63-94.26h122.05c3.8,0,6.89-3.08,6.89-6.89h0c0-34.23-27.74-61.97-61.96-61.97Zm-656.36,447.54h-193.34c-13.77,0-26.71-5.37-36.49-15.15l-36.49-36.49h18.45c41.38,0,80.28-16.11,109.47-45.37l57.22-57.15,57.22,57.15c26.36,26.42,60.66,41.99,97.53,44.79l-37.07,37.07c-9.78,9.78-22.72,15.15-36.49,15.15Zm471.77-357.41l-54.46,54.44-114.23-19.04c-3.75-.62-7.3,1.91-7.92,5.66h0c-5.63,33.76,17.18,65.69,50.93,71.31l11.37,1.9-73.1,73.07c-9.28,9.28-21.41,14.53-34.39,15.04l-.04-.04c-.69.14-1.38.14-2.07.14h-162.27c-13.72,0-26.87-5.45-36.57-15.15l-130.2-130.2-130.2,130.27c-9.78,9.71-22.72,15.08-36.49,15.08h-162.35c-.69,0-1.38,0-2.07-.14l-.04.04c-12.98-.52-25.11-5.77-34.39-14.98l-73.14-73.14,11.41-1.9c33.75-5.63,56.56-37.55,50.93-71.3h0c-.62-3.76-4.17-6.29-7.92-5.67l-114.25,19.04-54.45-54.45c-6.02-6.06-10.36-13.34-12.8-21.28h131.98c34.22,0,61.96-27.74,61.96-61.96h0c0-3.81- document.querySelectorAll('[data-cat]').forEach(el=>{el.innerHTML=CAT_SVG;});

const W=1080;
let H=1080;
function layout(){
  const dispW = Math.min(window.innerWidth-32, 600);
  const scale = dispW/W;
  document.querySelectorAll('.slide').forEach(s=>{s.style.transform='scale('+scale+')';});
  document.querySelectorAll('.frame').forEach(f=>{f.style.width=dispW+'px';f.style.height=(H*scale)+'px';});
}
function setRatio(r){
  H = (r==='45')?1350:1080;
  document.documentElement.style.setProperty('--sh', H+'px');
  document.querySelectorAll('.toggle button').forEach(b=>b.classList.toggle('on', b.dataset.r===r));
  layout();
}
document.getElementById('toggle').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; setRatio(b.dataset.r);
});

document.querySelectorAll('.edit').forEach(el=>{
  el.setAttribute('contenteditable','true');
  el.setAttribute('spellcheck','false');
});

window.addEventListener('resize',layout);
window.addEventListener('load',layout);
layout();
</script>
</body>
</html>
